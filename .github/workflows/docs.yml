name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# What GitHub Pages deployment needs, and nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          # This project declares its dependencies in setup.py, which the pip
          # cache does not look for on its own — it only globs requirements.txt
          # and pyproject.toml, and errors out when it finds neither.
          cache-dependency-path: setup.py

      # autodoc imports the package, so the runtime dependencies have to be
      # here too. mpi4py is mocked in conf.py rather than installed.
      - run: pip install -e ".[docs,viz]"

      # Deliberately not -W: intersphinx fetches inventories from python.org,
      # pyomo and pandas at build time, and one of them being briefly
      # unreachable is a warning. Failing the deploy over that would be worse
      # than shipping the page without a few cross-links. `make -C docs strict`
      # is the warnings-are-errors build; run that locally, or as its own job.
      - run: sphinx-build -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
