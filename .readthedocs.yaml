# ReadTheDocs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Autodoc imports the package, so a broken import shows up here as a
  # warning rather than a failed page. Flip this on once the build is clean
  # enough to keep it that way.
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - viz

formats:
  - pdf
